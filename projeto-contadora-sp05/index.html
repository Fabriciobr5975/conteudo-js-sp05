<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contadora com JavaScript</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Contadora Desenvolvida com JavaScript</h1>

    <div class="container">
      <div class="container-contadora">
        <p id="contadora">0</p>
      </div>

      <div class="container-botoes">
        <button id="btn-add">+</button>
        <button id="btn-rmv">-</button>
        <button id="btn-reset">Resetar</button>
        <button id="btn-save">Salva</button>
        <button id="btn-load">Carregar</button>
        <script src="./src/script.js" defer></script>
      </div>
    </div>
  </body>
</html>
